<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GuestPost Research Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #0f1117;
  --surface: #181c27;
  --surface2: #1e2335;
  --border: #2a3050;
  --accent: #4f8ef7;
  --accent2: #7c5cfc;
  --green: #22c55e;
  --yellow: #f59e0b;
  --red: #ef4444;
  --text: #e8eaf2;
  --muted: #7a82a0;
  --radius: 8px;
  --font: 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f0f2f8;
    --surface: #ffffff;
    --surface2: #f5f7ff;
    --border: #dde2f0;
    --text: #0f1117;
    --muted: #5a6080;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{flex:1;overflow-x:hidden}

/* Sidebar */
.logo{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.logo-text{font-size:15px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.logo-sub{font-size:11px;color:var(--muted);margin-top:2px}
.nav{padding:12px 0}
.nav-section{padding:4px 16px 2px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:8px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;border-radius:0;transition:background .15s;color:var(--muted);font-size:13px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(79,142,247,.12);color:var(--accent);font-weight:500}
.nav-item .icon{width:16px;flex-shrink:0;text-align:center}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);margin-top:auto}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
.status-dot.warn{background:var(--yellow)}
.status-dot.off{background:var(--muted)}

/* Main header */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px;justify-content:space-between;position:sticky;top:0;z-index:10}
.page-title{font-size:17px;font-weight:600}
.page-sub{font-size:12px;color:var(--muted);margin-top:1px}

/* Panels */
.content{padding:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
/* ── Mobile Navigation ── */
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;background:none;border:none;z-index:200}
.hamburger span{display:block;width:24px;height:2px;background:var(--text);border-radius:2px;transition:all .3s}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:98}
.mobile-overlay.active{display:block}

@media(max-width:900px){
  .grid4{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .sidebar{width:52px}
  .sidebar .logo-text,.sidebar .logo-sub,.sidebar .nav-section,.sidebar .nav-item span,.sidebar-footer p{display:none}
  .nav-item{justify-content:center;padding:12px}
  .sidebar-footer{padding:8px 0;display:flex;justify-content:center}
}

@media(max-width:768px){
  .hamburger{display:flex}
  .app{position:relative}
  .sidebar{
    position:fixed;top:0;left:-280px;height:100vh;width:260px!important;
    z-index:99;transition:left .3s ease;box-shadow:4px 0 20px rgba(0,0,0,.3)
  }
  .sidebar.mobile-open{left:0}
  .sidebar .logo-text,.sidebar .logo-sub,.sidebar .nav-section,.sidebar .nav-item span,.sidebar-footer p{display:block!important}
  .nav-item{justify-content:flex-start!important;padding:10px 16px!important}
  .sidebar-footer{padding:12px 16px!important;display:block!important}
  .main{width:100%;min-width:0}
  .topbar{padding:10px 16px;gap:8px}
  .page-title{font-size:15px}
  .page-sub{font-size:11px}
  .content{padding:12px}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .btn-group{flex-wrap:wrap}
  .btn-group button{flex:1;min-width:120px}
  .section-header{flex-direction:column;align-items:flex-start;gap:8px}
  .section-header .flex{flex-wrap:wrap;width:100%}
  .section-header .flex input{flex:1;min-width:0}
  .tab-bar{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab-bar::-webkit-scrollbar{display:none}
  .stat-num{font-size:22px}
  button{min-height:44px}
  input,select,textarea{min-height:44px;font-size:16px!important}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius)}
  table{min-width:600px;font-size:12px}
  th,td{padding:8px 10px}
  .url-cell,.truncate{max-width:120px}
  .quality-circle{width:36px;height:36px;font-size:11px}
  .score-bar{width:60px}
  .badge{font-size:10px;padding:2px 6px}
  .alert{font-size:12px;padding:10px 12px}
  .card{padding:12px}
  .stat-card{padding:12px 14px}
  pre{font-size:10px;overflow-x:auto}
  .modal-inner{margin:16px!important;padding:16px!important}
}

@media(max-width:480px){
  .grid4{grid-template-columns:1fr 1fr}
  .page-title{font-size:14px}
  .topbar{flex-wrap:wrap}
  table{min-width:500px;font-size:11px}
  th,td{padding:6px 8px}
  .stat-num{font-size:20px}
  .btn-sm{min-height:36px;padding:6px 10px}
}

@media(max-width:320px){
  .content{padding:8px}
  .card{padding:10px}
  .grid4{grid-template-columns:1fr}
  table{min-width:400px}
}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px}
.stat-num{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:2px}
.stat-label{font-size:12px;color:var(--muted)}
.stat-change{font-size:11px;margin-top:4px}

/* Form elements */
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;color:var(--text);font-family:inherit;font-size:13px;width:100%;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;font-weight:500}
.field{margin-bottom:14px}

button{cursor:pointer;border:none;border-radius:var(--radius);padding:9px 16px;font-size:13px;font-weight:500;font-family:inherit;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#3a7de8;transform:translateY(-1px)}
.btn-primary:disabled{background:var(--muted);cursor:not-allowed;transform:none}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

/* Tags / badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500}
.badge-blue{background:rgba(79,142,247,.15);color:var(--accent)}
.badge-green{background:rgba(34,197,94,.15);color:var(--green)}
.badge-yellow{background:rgba(245,158,11,.15);color:var(--yellow)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red)}
.badge-gray{background:var(--surface2);color:var(--muted)}

/* Table */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--surface2)}
th{padding:10px 14px;text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(79,142,247,.04)}

/* Score bar */
.score-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px;width:80px}
.score-fill{height:100%;border-radius:3px;transition:width .4s}

/* Misc */
.divider{height:1px;background:var(--border);margin:20px 0}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
.alert{padding:12px 16px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;border:1px solid}
.alert-info{background:rgba(79,142,247,.08);border-color:rgba(79,142,247,.25);color:var(--accent)}
.alert-warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.25);color:var(--yellow)}
.alert-success{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.25);color:var(--green)}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;background:var(--surface2);color:var(--muted);margin:1px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:15px;font-weight:600}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.toggle input{width:auto}
.url-cell{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px}
.flex{display:flex;align-items:center;gap:8px}
.gap-4{gap:16px}
.mt-12{margin-top:12px}
.mt-16{margin-top:16px}
.mb-16{margin-bottom:16px}
textarea{resize:vertical;min-height:80px}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.checkbox-row input{width:auto;cursor:pointer}
.quality-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:3px solid}
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:9px 16px;cursor:pointer;border-bottom:2px solid transparent;font-size:13px;color:var(--muted);transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;font-weight:500}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.two-col{grid-template-columns:1fr}}
.tooltip{position:relative}
.tooltip:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;white-space:nowrap;z-index:100;pointer-events:none}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="mobile-overlay" id="mobile-overlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-text">🔍 GuestPost<br>Research Hub</div>
      <div class="logo-sub">Free · No paid APIs needed</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer">
      <p style="font-size:11px;color:var(--muted);line-height:1.5">
        <span class="status-dot" id="db-dot"></span><span id="db-label">Session mode</span><br>
        <span style="font-size:10px">Data saved locally this session</span>
      </p>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger" onclick="toggleSidebar()">
  <span></span><span></span><span></span>
</button>
      <div>
        <div class="page-title" id="page-title">Dashboard</div>
        <div class="page-sub" id="page-sub">Overview of your research activity</div>
      </div>
      <div class="flex">
        <div id="search-status" style="font-size:12px;color:var(--muted)"></div>
      </div>
    </div>
    <div class="content" id="page-content"></div>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
const state = {
  clients: [],
  websites: [],
  searches: [],
  exports: [],
  settings: {
    serpApiKey: '',
    valueSerp: '',
    defaultNiche: 'SEO',
    defaultCountry: 'United States',
    maxResults: 50,
    rateLimitMs: 1500,
    supabaseUrl: '',
    supabaseKey: '',
    googleClientId: '',
  }
};

// Load from localStorage
try {
  const saved = localStorage.getItem('gprh_data');
  if (saved) { const d = JSON.parse(saved); Object.assign(state, d); }
  const sett = localStorage.getItem('gprh_settings');
  if (sett) Object.assign(state.settings, JSON.parse(sett));
} catch(e) {}

function save() {
  try {
    localStorage.setItem('gprh_data', JSON.stringify({
      clients: state.clients, websites: state.websites,
      searches: state.searches, exports: state.exports
    }));
    localStorage.setItem('gprh_settings', JSON.stringify(state.settings));
  } catch(e) { console.warn('Storage full'); }
}

// ─── Navigation ──────────────────────────────────────────────────────────────
const pages = [
  { id:'overview', label:'Dashboard', icon:'📊', sub:'Research summary' },
  { id:'clients', label:'Find Clients', icon:'🏢', sub:'Discover US agencies needing guest posting' },
  { id:'websites', label:'Find GP Sites', icon:'🌐', sub:'Sites that accept guest contributions' },
  { id:'results', label:'Results', icon:'📋', sub:'All collected records' },
  { id:'quality', label:'Quality Analysis', icon:'⭐', sub:'Website quality scoring' },
  { id:'saved', label:'Saved Searches', icon:'💾', sub:'Search history and saved queries' },
  { id:'import', label:'Import Data', icon:'📥', sub:'Import CSV or seed URLs' },
  { id:'export', label:'Export Center', icon:'📤', sub:'Download Excel, Word, CSV' },
  { id:'settings', label:'Settings', icon:'⚙️', sub:'API keys and integrations' },
];

let currentPage = 'overview';

function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = pages.map(p => `
    <button class="nav-item${currentPage===p.id?' active':''}" onclick="navigate('${p.id}')">
      <span class="icon">${p.icon}</span>
      <span>${p.label}</span>
    </button>
  `).join('');
}

function navigate(id) {
  currentPage = id;
  const p = pages.find(x=>x.id===id);
  document.getElementById('page-title').textContent = p.label;
  document.getElementById('page-sub').textContent = p.sub;
  buildNav();
  render();
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
const niches = ['SEO','Technology','SaaS','Health & Wellness','Business','Finance','Travel','Lifestyle','Real Estate','Education','Marketing','Legal','Food & Nutrition','Fitness','E-commerce','Cybersecurity','AI & ML','HR & Recruitment','Sustainability','Insurance'];
const confidenceLabels = {4:'Strong evidence',3:'Relevant business, demand not confirmed',2:'Weak evidence',1:'Needs manual review'};
const confidenceClass = {4:'badge-green',3:'badge-blue',2:'badge-yellow',1:'badge-red'};
const gpStatusLabels = {1:'Guest posts explicitly accepted',2:'Sponsored content offered',3:'Contributor submissions accepted',4:'Possible, not confirmed',5:'Not currently verified'};
const gpStatusClass = {1:'badge-green',2:'badge-blue',3:'badge-blue',4:'badge-yellow',5:'badge-gray'};

function normalizeDomain(url) {
  try {
    return new URL(url.startsWith('http')?url:'https://'+url).hostname.replace(/^www\./,'');
  } catch(e) { return url.replace(/^(https?:\/\/)?(www\.)?/,'').split('/')[0]; }
}

function scoreColor(s) {
  if(s>=75) return 'var(--green)';
  if(s>=50) return 'var(--accent)';
  if(s>=30) return 'var(--yellow)';
  return 'var(--red)';
}

function qualityCircle(score) {
  const c = scoreColor(score);
  return `<div class="quality-circle" style="border-color:${c};color:${c}">${score}</div>`;
}

function scoreBar(score) {
  return `<div class="score-bar"><div class="score-fill" style="width:${score}%;background:${scoreColor(score)}"></div></div>`;
}

function dateFmt(d) {
  if(!d) return '—';
  return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }

function hasDuplicate(arr, url, id) {
  const dom = normalizeDomain(url);
  return arr.some(x=>x.id!==id && normalizeDomain(x.url||x.website||'')===dom);
}

// ─── Query Generators ────────────────────────────────────────────────────────
function genClientQueries(niche, country) {
  const base = [
    `"guest posting services" "${country}"`,
    `"link building agency" ${country} ${niche}`,
    `"looking for link building specialist" ${niche}`,
    `"guest post outreach project" ${niche}`,
    `"SEO agency link building services" ${country}`,
    `"guest post website outreach" ${niche}`,
    `"seeking backlink building services" ${niche}`,
    `"we need guest posts" ${niche} ${country}`,
    `"link building campaign" agency ${niche} ${country}`,
    `"hire guest post writer" ${niche}`,
    `"backlink acquisition" ${niche} agency ${country}`,
    `site:clutch.co "link building" "${country}"`,
    `site:linkedin.com "link building specialist" "${country}" ${niche}`,
    `"outsource guest posting" ${niche}`,
  ];
  return base;
}

function genWebsiteQueries(niche) {
  return [
    `"write for us" ${niche}`,
    `"submit a guest post" ${niche}`,
    `"guest post guidelines" ${niche}`,
    `"become a contributor" ${niche}`,
    `"contribute an article" ${niche}`,
    `"guest author" ${niche}`,
    `"accepting guest posts" ${niche}`,
    `"submit your article" ${niche}`,
    `"we accept guest posts" ${niche}`,
    `"guest blogging" ${niche} guidelines`,
    `intitle:"write for us" ${niche}`,
    `inurl:"write-for-us" ${niche}`,
  ];
}

// ─── Scoring Logic ───────────────────────────────────────────────────────────
function scoreClient(c) {
  let s = 0;
  if(c.evidenceType === 'explicit_demand') s += 40;
  else if(c.evidenceType === 'job_listing') s += 30;
  else if(c.evidenceType === 'service_page') s += 20;
  else if(c.evidenceType === 'directory') s += 10;
  else s += 5;
  if(c.email) s += 15;
  if(c.contact_page) s += 10;
  if(c.niche) s += 5;
  if(c.location_evidence) s += 10;
  if(c.service_page) s += 10;
  return Math.min(s, 100);
}

function scoreWebsite(w) {
  let score = 0; let coverage = 0; let total = 0;
  // Traffic (25)
  total += 25;
  if(w.traffic !== null && w.traffic !== undefined && w.traffic !== '') {
    score += w.traffic > 10000 ? 25 : w.traffic > 1000 ? 18 : w.traffic > 100 ? 10 : 5;
    coverage += 25;
  }
  // Niche (20)
  total += 20;
  if(w.niche) { score += 20; coverage += 20; }
  // Backlinks (15)
  total += 15;
  if(w.referring_domains !== null && w.referring_domains !== undefined && w.referring_domains !== '') {
    score += w.referring_domains > 1000 ? 15 : w.referring_domains > 100 ? 10 : 5;
    coverage += 15;
  }
  // Content quality (15)
  total += 15;
  if(w.gp_status <= 3) { score += 15; coverage += 15; }
  else if(w.gp_status === 4) { score += 5; coverage += 15; }
  // Activity (10)
  total += 10;
  if(w.last_verified) {
    const days = (Date.now()-new Date(w.last_verified))/(1000*86400);
    score += days < 90 ? 10 : days < 180 ? 7 : 3;
    coverage += 10;
  }
  // Outbound (10)
  total += 10;
  if(w.spam_score !== null && w.spam_score !== undefined && w.spam_score !== '') {
    score += w.spam_score < 5 ? 10 : w.spam_score < 15 ? 6 : 2;
    coverage += 10;
  }
  // Editorial (5)
  total += 5;
  if(w.guidelines_url) { score += 3; coverage += 5; }
  if(w.contact_info) { score += 2; }
  const pct = Math.round(coverage/total*100);
  const provisional = pct < 100 ? Math.round(score / (coverage/100 || 1) * (pct/100)) : null;
  return { score: Math.min(score, 100), coverage: pct, provisional };
}

// ─── Simulated Search (no live API) ──────────────────────────────────────────
async function fetchRealResults(query) {
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
    const data = await res.json();
    if (data.error) return [];
    return (data.organic_results || []).map(r => ({
      title: r.title || '',
      url: r.link || '',

async function runClientSearch() {
  const niche = document.getElementById('cl-niche').value;
  const country = document.getElementById('cl-country').value;
  clientSearchState.niche = niche; clientSearchState.country = country;
  clientSearchState.running = true; clientSearchState.progress = 0;

  clientSearchState.queries = queries;
  render();
  // Record search
  state.searches.push({id:uid(), type:'clients', niche, country, date:new Date().toISOString(), queries_count:queries.length});

  for(let i=0;i<queries.length;i++) {
    clientSearchState.progress = i+1;
    const el = document.getElementById('cl-progress');
    if(el) el.style.width = Math.round((i+1)/queries.length*100)+'%';
    await new Promise(r=>setTimeout(r, 200)); // simulate delay
    const realResults = await fetchRealResults(queries[i]);
const results = realResults.length > 0 ? realResults.map(r => ({
  id: uid(),
  company_name: r.title.split('-')[0].split('|')[0].trim(),
  url: r.url,
  domain: normalizeDomain(r.url),
  contact_page: '',
  email: '',
  niche: niche,
  location_evidence: '',
  service_page: '',
  job_listing: '',
  evidence_url: r.url,
  evidence_excerpt: r.snippet,
  evidence_date: '',
  discovery_date: new Date().toISOString(),
  last_checked: new Date().toISOString(),
  score: 0,
  confidence: 2,
  outreach_angle: '',
  contact_status: 'Not contacted',
  evidenceType: r.snippet && (r.snippet.toLowerCase().includes('guest post') || r.snippet.toLowerCase().includes('link building') || r.snippet.toLowerCase().includes('write for us')) ? 'explicit_demand' : r.snippet && r.snippet.toLowerCase().includes('seo') ? 'service_page' : 'directory',
  source_query: queries[i],
  _simulated: false
})) : generateMockClientResults(queries[i], niche);
    for(const r of results) {
      if(!hasDuplicate(state.clients, r.url, r.id)) {
        r.score = scoreClient(r);
        state.clients.push(r);
      }
    }
  }
  clientSearchState.running = false;
  save();
  render();
}

  const status = prompt('Contact status (Not contacted / Contacted / Responded / Closed):', c.contact_status||'Not contacted');
  if(status!==null) {c.contact_status=status;}
  save(); render();
}

async function runGPSearch() {
  const niche = document.getElementById('gp-niche').value;
  gpSearchState.niche = niche; gpSearchState.running = true; gpSearchState.progress = 0;
  const queries = genWebsiteQueries(niche);
  gpSearchState.queries = queries;
  render();
  state.searches.push({id:uid(), type:'websites', niche, date:new Date().toISOString(), queries_count:queries.length});

  for(let i=0;i<queries.length;i++) {
    gpSearchState.progress = i+1;
    const el = document.getElementById('gp-progress');
    if(el) el.style.width = Math.round((i+1)/queries.length*100)+'%';
    await new Promise(r=>setTimeout(r, 150));
    const realResults = await fetchRealResults(queries[i]);
const blockedDomains = ['youtube.com','x.com','twitter.com','upwork.com','reddit.com','quora.com','facebook.com','instagram.com','linkedin.com','pinterest.com','amazon.com','wikipedia.org','forbes.com','medium.com','blogger.com','wordpress.com'];

const filteredResults = realResults.filter(r => {
  const domain = normalizeDomain(r.url);
  return !blockedDomains.some(b => domain.includes(b));
});

const results = filteredResults.length > 0 ? filteredResults.map(r => ({
  id: uid(),
  name: r.title.split('-')[0].split('|')[0].trim(),
  url: r.url,
  domain: normalizeDomain(r.url),
  niche: niche,
  language: 'English',
  location_evidence: '',
  gp_status: r.snippet && (r.snippet.toLowerCase().includes('write for us') || r.snippet.toLowerCase().includes('guest post') || r.snippet.toLowerCase().includes('submit') || r.snippet.toLowerCase().includes('contributor')) ? 1 : 4,
  gp_evidence: r.snippet,
  guidelines_url: '',
  submission_url: '',
  contact_info: '',
  editorial_policy: '',
  sponsored_info: '',
  evidence_excerpt: r.snippet,
  source_url: r.url,
  last_verified: new Date().toISOString(),
  da: null, dr: null, traffic: null,
  referring_domains: null, backlinks: null, spam_score: null,
  data_provider: 'SerpAPI',
  data_date: new Date().toISOString(),
  score: 0,
  source_query: queries[i],
  _simulated: false
})) : generateMockWebsiteResults(queries[i], niche);
    for(const r of results) {
      if(!hasDuplicate(state.websites, r.url, r.id)) state.websites.push(r);
    }
  }
  gpSearchState.running = false;
  save();
  render();
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,'').toLowerCase().replace(/ /g,'_'));
  return lines.slice(1).filter(l=>l.trim()).map(line=>{
    const vals = [];
    let cur='', inQ=false;
    for(const ch of line) {
      if(ch==='"') inQ=!inQ;
      else if(ch===','&&!inQ) { vals.push(cur); cur=''; }
      else cur+=ch;
    }
    vals.push(cur);
    const obj={};
    headers.forEach((h,i)=>obj[h]=(vals[i]||'').trim().replace(/^"|"$/g,''));
    return obj;
  });
}

function importClientCSV() {
  const file = document.getElementById('cl-csv-file').files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const rows = parseCSV(e.target.result);
      let added=0, dupes=0;
      for(const r of rows) {
        if(!r.url) continue;
        const entry = {
          id:uid(), company_name:r.company_name||r.name||r.domain||'',
          url:r.url, domain:normalizeDomain(r.url),
          niche:r.niche||'Unknown', email:r.email||'',
          location_evidence:r.location_evidence||r.location||'',
          evidence_url:r.evidence_url||r.url, evidence_excerpt:r.evidence_excerpt||'',
          confidence:parseInt(r.confidence)||2,
          discovery_date:new Date().toISOString(), last_checked:new Date().toISOString(),
          contact_status:'Not contacted', contact_page:'', service_page:'',
          outreach_angle:'', _imported:true
        };
        entry.score = scoreClient(entry);
        if(hasDuplicate(state.clients,r.url,entry.id)) { dupes++; continue; }
        state.clients.push(entry); added++;
      }
      save();
      document.getElementById('cl-import-msg').innerHTML = `<span class="badge badge-green">✓ Imported ${added} records (${dupes} duplicates skipped)</span>`;
      render();
    } catch(err) {
      document.getElementById('cl-import-msg').innerHTML = `<span class="badge badge-red">Error: ${err.message}</span>`;
    }
  };
  reader.readAsText(file);
}

          guidelines_url:r.guidelines_url||r.guidelines||'',
          submission_url:r.submission_url||'', contact_info:r.contact_info||'',
          editorial_policy:'', sponsored_info:'', evidence_excerpt:'', source_url:r.url,
          last_verified:new Date().toISOString(),
          da:r.da!==''?Number(r.da)||null:null,
          dr:r.dr!==''?Number(r.dr)||null:null,
          traffic:r.traffic!==''?Number(r.traffic)||null:null,
          referring_domains:r.referring_domains!==''?Number(r.referring_domains)||null:null,
          backlinks:r.backlinks!==''?Number(r.backlinks)||null:null,
          spam_score:r.spam_score!==''?Number(r.spam_score)||null:null,
          data_provider:r.data_provider||'Imported', data_date:new Date().toISOString(),
          _imported:true
        };
        const sq = scoreWebsite(w); w.score=sq.score; w.coverage=sq.coverage; w.provisional=sq.provisional;
        if(hasDuplicate(state.websites,r.url,w.id)) { dupes++; continue; }
        state.websites.push(w); added++;
      }
      save();
      document.getElementById('gp-import-msg').innerHTML = `<span class="badge badge-green">✓ Imported ${added} records (${dupes} duplicates skipped)</span>`;
      render();
    } catch(err) {
      document.getElementById('gp-import-msg').innerHTML = `<span class="badge badge-red">Error: ${err.message}</span>`;
    }
  };
  reader.readAsText(file);
}

function importSeedURLs() {
  const raw = document.getElementById('seed-urls').value;
  const niche = document.getElementById('seed-niche').value;
  const urls = raw.split('\n').map(u=>u.trim()).filter(u=>u);
  let added=0, dupes=0;
  for(const url of urls) {
    if(!url.startsWith('http')) continue;
    const domain = normalizeDomain(url);
    const w = {
      id:uid(), name:domain, url, domain, niche, language:'', location_evidence:'',
      gp_status:4, gp_evidence:'Seed URL — manually added, GP status not confirmed',
      guidelines_url:'', submission_url:'', contact_info:'', editorial_policy:'',
      sponsored_info:'', evidence_excerpt:'Manually seeded URL', source_url:'',
      last_verified:new Date().toISOString(),
      da:null,dr:null,traffic:null,referring_domains:null,backlinks:null,spam_score:null,
      data_provider:'Manual entry', data_date:new Date().toISOString(), _seeded:true
    };
    const sq=scoreWebsite(w); w.score=sq.score; w.coverage=sq.coverage; w.provisional=sq.provisional;
    if(hasDuplicate(state.websites,url,w.id)) { dupes++; continue; }
    state.websites.push(w); added++;
  }
  save();
  document.getElementById('seed-msg').innerHTML = `<span class="badge badge-green">✓ Added ${added} seed URLs (${dupes} duplicates skipped)</span>`;
  render();
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

<tr><th>Website</th><th>Niche</th><th>Quality</th><th>DA</th><th>Traffic/mo</th><th>Guidelines</th></tr>
${confirmedSites.map(w=>`<tr>
<td><a href="${w.url}"><strong>${w.name||w.domain}</strong></a></td>
<td>${w.niche||'—'}</td>
<td>${w.score}/100 (${w.coverage}% data coverage)</td>
<td>${w.da!=null?w.da:'<span class="warn">Unknown</span>'}</td>
<td>${w.traffic!=null?Number(w.traffic).toLocaleString():'<span class="warn">Unknown</span>'}</td>
<td>${w.guidelines_url?`<a href="${w.guidelines_url}">View</a>`:'—'}</td>
</tr>`).join('')}
</table>`}

<h2>All GP Websites — Quality Findings</h2>
<table>
<tr><th>Website</th><th>Score</th><th>Coverage</th><th>GP Status</th><th>Flags</th></tr>
${state.websites.map(w=>{
  const flags=[];
  if(!w.da&&!w.traffic) flags.push('No SEO metrics');
  if(w.spam_score>15) flags.push('High spam score');
  if(!w.guidelines_url) flags.push('No guidelines URL');
  if(w.gp_status>=4) flags.push('GP unconfirmed');
  return `<tr>
  <td><a href="${w.url}">${w.name||w.domain}</a></td>
  <td>${w.score}/100</td>
  <td>${w.coverage}%${w.provisional!=null?' *':''}</td>
  <td>${gpStatusLabels[w.gp_status]||'Unknown'}</td>
  <td style="font-size:9pt;color:#e65100">${flags.join(', ')||'—'}</td>
  </tr>`;
}).join('')}
</table>
<p style="font-size:9pt;color:#666">* Provisional score where data is incomplete. This report does not guarantee website safety, link-building outcomes, or Google ranking improvement. Quality flags are screening signals only.</p>

<h2>Missing Data Warnings</h2>
${missingMetrics.length ? `<ul>${missingMetrics.map(w=>`<li><a href="${w.url}">${w.name||w.domain}</a> — DA: Unknown, Traffic: Unknown. Score is provisional at ${w.score}/100 (${w.coverage}% data coverage).</li>`).join('')}</ul>` : '<p>All records have at least one verifiable metric.</p>'}

<h2>Source Evidence</h2>
<table>
<tr><th>Type</th><th>Record</th><th>Source</th><th>Date</th></tr>
${[
  ...state.clients.map(c=>({type:'Client',name:c.company_name||c.domain,url:c.evidence_url||c.url,date:c.discovery_date})),
  ...state.websites.map(w=>({type:'Website',name:w.name||w.domain,url:w.source_url||w.url,date:w.last_verified}))
].map(r=>`<tr><td>${r.type}</td><td>${r.name}</td><td><a href="${r.url}">${r.url}</a></td><td>${r.date?new Date(r.date).toLocaleDateString():''}</td></tr>`).join('')}
</table>
</body></html>`;
  downloadBlob(new Blob([html],{type:'application/msword'}), `guestpost_report_${Date.now()}.doc`);
  recordExport('Word Report', state.clients.length+state.websites.length);
  render();
}

function exportGoogleSheets() {
  alert('Google Sheets export requires OAuth setup. Please configure your Google Client ID in Settings and re-open the app. The OAuth flow will request permission to create/edit sheets in your Google account.\n\nFor security:\n• OAuth tokens are never stored in plaintext\n• No Google password is ever requested\n• Only Sheet-scope permissions are requested');
}

function recordExport(type, count) {
  state.exports.push({id:uid(), type, count, date:new Date().toISOString()});
  save();
}

// ─── Main Render ──────────────────────────────────────────────────────────────
function render() {
  const content = document.getElementById('page-content');
  try {
    switch(currentPage) {
      case 'overview':  content.innerHTML = renderOverview(); break;
      case 'clients':   content.innerHTML = renderClients(); break;
      case 'websites':  content.innerHTML = renderWebsites(); break;
      case 'results':   content.innerHTML = renderResults(); break;
      case 'quality':   content.innerHTML = renderQuality(); break;
      case 'saved':     content.innerHTML = renderSaved(); break;
      case 'import':    content.innerHTML = renderImport(); break;
      case 'export':    content.innerHTML = renderExport(); break;
      case 'settings':  content.innerHTML = renderSettings(); break;
      default:          content.innerHTML = renderOverview();
    }
  } catch(e) {
    content.innerHTML = `<div class="alert alert-warn"><strong>Render error:</strong> ${e.message}</div>`;
    console.error(e);
  }
  buildNav();
}

// Init
buildNav();
render();
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('mobile-overlay');
  const hamburger = document.getElementById('hamburger');
  sidebar.classList.toggle('mobile-open');
  overlay.classList.toggle('active');
  hamburger.classList.toggle('open');
}

// Close sidebar when navigating on mobile
const origNavigate = navigate;
window.navigate = function(id) {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('mobile-overlay');
  const hamburger = document.getElementById('hamburger');
  if(window.innerWidth <= 768) {
    sidebar.classList.remove('mobile-open');
    overlay.classList.remove('active');
    hamburger.classList.remove('open');
  }
  origNavigate(id);
}
</script>
